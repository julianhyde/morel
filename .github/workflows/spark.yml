#
# Tests against a live Spark Connect server, weekly. The regular CI
# (main.yml) never starts Spark; it runs the translation-only tests.
name: Spark

on:
  workflow_dispatch: # allow manual triggering
  schedule:
    # Run at 0617 UTC every Monday
    #        m  h  dom mon dow
    - cron: '17 06   *   *   1'

jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'
          cache: 'maven'
      - name: Start Spark Connect server
        run: |
          uri=$(src/test/resources/spark/start-spark.sh --new)
          echo "SPARK_REMOTE=$uri" >> "$GITHUB_ENV"
      - name: Run the seed queries with the PySpark client
        run: |
          python3 -m venv pyenv
          pyenv/bin/pip install --quiet pyspark-client
          pyenv/bin/python src/test/resources/spark/capture.py --execute
      - name: Build and test with live Spark
        run: ./mvnw --batch-mode verify -Dmorel.spark=true
      - name: Server log on failure
        if: failure()
        run: docker logs --tail 200 morel-spark

# End spark.yml
